openapi: 3.1.0
info:
  title: EdgeSync API
  version: 1.0.0
  description: |
    REST API for EdgeSync network synchronization monitoring and management.
    The conceptual meaning of monitoring data is defined in
    docs/reference/monitoring-data-model.md.
servers:
  - url: https://api.example.com
    description: Example server

tags:
  - name: Devices
    description: Network device management.
  - name: Synchronization
    description: Synchronization status and source management.
  - name: Alarms
    description: Alarm retrieval and lifecycle operations.

paths:
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List devices
      operationId: listDevices
      responses:
        '200':
          description: Registered devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Devices]
      summary: Register a device
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }

  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      summary: Get a device
      operationId: getDevice
      responses:
        '200':
          description: Device information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
    patch:
      tags: [Devices]
      summary: Update a device
      operationId: updateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Device updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }
    delete:
      tags: [Devices]
      summary: Remove a device
      operationId: deleteDevice
      responses:
        '204': { description: Device removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }

  /api/v1/devices/{deviceId}/synchronization:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Synchronization]
      summary: Get synchronization status
      operationId: getSynchronizationStatus
      description: |
        Returns the current synchronization information for a monitored device.
        `source` is the current active synchronization source and is null when
        no active source is available. It is not a historical-source field.
      responses:
        '200':
          description: Current synchronization status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynchronizationStatus' }
              example:
                deviceId: edge-001
                state: LOCKED
                source: ptp-gm-01
                offsetNs: 35
                frequencyOffsetPpb: 0.8
                jitterNs: 12
                lastUpdated: '2026-09-08T08:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }

  /api/v1/synchronization/sources:
    get:
      tags: [Synchronization]
      summary: List synchronization sources
      operationId: listSynchronizationSources
      responses:
        '200':
          description: Configured synchronization sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SynchronizationSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Synchronization]
      summary: Create a synchronization source
      operationId: createSynchronizationSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SynchronizationSourceCreate' }
      responses:
        '201':
          description: Synchronization source created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynchronizationSource' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }

  /api/v1/synchronization/sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Synchronization]
      summary: Get a synchronization source
      operationId: getSynchronizationSource
      responses:
        '200':
          description: Synchronization source information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynchronizationSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
    patch:
      tags: [Synchronization]
      summary: Update a synchronization source
      operationId: updateSynchronizationSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SynchronizationSourceUpdate' }
      responses:
        '200':
          description: Synchronization source updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynchronizationSource' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }
    delete:
      tags: [Synchronization]
      summary: Delete a synchronization source
      operationId: deleteSynchronizationSource
      responses:
        '204': { description: Source deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }

  /api/v1/alarms:
    get:
      tags: [Alarms]
      summary: List alarms
      operationId: listAlarms
      responses:
        '200':
          description: Alarm records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alarm' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/alarms/{alarmId}:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
    get:
      tags: [Alarms]
      summary: Get an alarm
      operationId: getAlarm
      responses:
        '200':
          description: Alarm information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AlarmNotFound' }

  /api/v1/alarms/{alarmId}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
    post:
      tags: [Alarms]
      summary: Acknowledge an alarm
      operationId: acknowledgeAlarm
      responses:
        '200':
          description: Alarm acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AlarmNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }

  /api/v1/alarms/{alarmId}/clear:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
    post:
      tags: [Alarms]
      summary: Clear an alarm
      operationId: clearAlarm
      responses:
        '200':
          description: Alarm cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AlarmNotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }

components:
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
      description: Unique identifier of the monitored device.
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
      description: Unique identifier of the synchronization source.
    AlarmId:
      name: alarmId
      in: path
      required: true
      schema: { type: string }
      description: Unique identifier of the alarm.

  schemas:
    Device:
      type: object
      required: [deviceId, name, status]
      properties:
        deviceId: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [ONLINE, OFFLINE, UNKNOWN]
          description: Device-management status; separate from Synchronization State.
        type: { type: string }
        address: { type: string }

    DeviceCreate:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        type: { type: string }
        address: { type: string }

    DeviceUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }

    SynchronizationStatus:
      type: object
      required: [deviceId, state, source, lastUpdated]
      properties:
        deviceId: { type: string }
        state: { $ref: '#/components/schemas/SynchronizationState' }
        source:
          type: [string, 'null']
          description: Current active synchronization source ID; null when none is available.
        offsetNs:
          type: [integer, 'null']
          description: Estimated clock offset in nanoseconds.
        frequencyOffsetPpb:
          type: [number, 'null']
          description: Frequency offset in parts per billion.
        jitterNs:
          type: [integer, 'null']
          description: Synchronization timing variation in nanoseconds.
        lastUpdated:
          type: string
          format: date-time

    SynchronizationState:
      type: string
      enum: [LOCKED, HOLDOVER, FREERUN, FAILED]

    SynchronizationSource:
      type: object
      required: [id, name, type, status, priority]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/SynchronizationSourceType' }
        status: { $ref: '#/components/schemas/SourceStatus' }
        priority:
          type: integer
          minimum: 1

    SynchronizationSourceCreate:
      type: object
      required: [id, name, type, priority]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/SynchronizationSourceType' }
        priority: { type: integer, minimum: 1 }

    SynchronizationSourceUpdate:
      type: object
      properties:
        name: { type: string }
        priority: { type: integer, minimum: 1 }

    SynchronizationSourceType:
      type: string
      enum: [PTP, NTP]
      description: PTP represents a PTP Grandmaster; NTP represents an NTP Server.

    SourceStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]

    Alarm:
      type: object
      required: [alarmId, code, message, status, createdAt]
      properties:
        alarmId: { type: string }
        code: { type: string }
        message: { type: string }
        status:
          type: string
          enum: [ACTIVE, ACKNOWLEDGED, CLEARED]
        deviceId: { type: string }
        severity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR, WARNING]
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        clearedAt: { type: [string, 'null'], format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [string, 'null'] }

  responses:
    InvalidRequest:
      description: Request is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DeviceNotFound:
      description: Device was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SourceNotFound:
      description: Synchronization source was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AlarmNotFound:
      description: Alarm was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ResourceConflict:
      description: Operation conflicts with the current resource state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidConfiguration:
      description: Configuration is not acceptable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
